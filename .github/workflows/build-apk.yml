name: Build DexKeyBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dexkeybridge-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable DexKeyBridge signing key
        uses: actions/cache@v4
        with:
          path: .signing/dexkeybridge.keystore
          key: dexkeybridge-stable-signing-v1

      - name: Create stable signing key if missing
        shell: bash
        run: |
          mkdir -p .signing
          if [ ! -f .signing/dexkeybridge.keystore ]; then
            keytool -genkeypair -v \
              -keystore .signing/dexkeybridge.keystore \
              -storepass dexkeybridge123 \
              -alias dexkeybridge \
              -keypass dexkeybridge123 \
              -dname "CN=DexKeyBridge Stable,O=DexKeyBridge,C=PE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v \
            -keystore .signing/dexkeybridge.keystore \
            -storepass dexkeybridge123 \
            -alias dexkeybridge | grep -E "Owner:|SHA256:"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signing and certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexKeyBridge-v13-apk
          path: app/build/outputs/apk/debug/app-debug.apk
